apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serving-hpa
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: model-serving
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
