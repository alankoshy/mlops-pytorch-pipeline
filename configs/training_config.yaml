data:
  dataset: "CIFAR10"
  data_dir: "./data"
  num_workers: 8

model:
  architecture: "resnet18"
  num_classes: 10
  pretrained: true

training:
  batch_size: 128
  epochs: 20
  learning_rate: 0.01
  device: "cuda"
  early_stopping_patience: 3

output:
  checkpoint_dir: "./checkpoints"
  model_name: "best_model.pth"
